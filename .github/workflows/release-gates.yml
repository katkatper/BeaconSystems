name: Production release gates

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: beacon_ci
          POSTGRES_USER: beacon_ci
          POSTGRES_PASSWORD: beacon_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beacon_ci -d beacon_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg2://beacon_ci:beacon_ci_password@127.0.0.1:5432/beacon_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg2://beacon_ci:beacon_ci_password@127.0.0.1:5432/beacon_ci
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      JWT_ISSUER: beacon-api-ci
      JWT_AUDIENCE: beacon-web-ci
      ENABLE_LOCAL_SCHEMA_BOOTSTRAP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify repository hygiene
        run: python scripts/check_repository_hygiene.py
      - name: Validate production configuration inventory
        run: python scripts/validate_deployment_config.py --check-manifest
      - name: Audit Python dependencies
        # python-jose currently installs ecdsa, but Beacon signs only with HS256.
        # PYSEC-2026-1325 affects ECDSA operations and has no fixed release.
        run: python -m pip_audit -r requirements.txt --progress-spinner off --ignore-vuln PYSEC-2026-1325
      - name: Scan Python source for security issues
        run: python -m bandit -r config database integrations models routes security services -ll
      - name: Reject critical Python correctness errors
        run: python -m ruff check config database integrations models routes schemas security services main.py scripts tests --select E9,F63,F7,F82
      - name: Require one migration head
        run: test "$(alembic heads | wc -l)" -eq 1
      - name: Apply migrations to PostgreSQL
        run: alembic upgrade head
      - name: Verify models match the migrated schema
        run: alembic check
      - name: Run backend and isolation tests with coverage floor
        run: >-
          python -m pytest tests -q -p no:cacheprovider
          --cov=config --cov=database --cov=integrations --cov=models
          --cov=routes --cov=schemas --cov=security --cov=services
          --cov-fail-under=24 --cov-report=term
      - name: Verify PostgreSQL multi-worker queue claims
        env:
          BEACON_QUEUE_TEST_DATABASE_URL: postgresql+psycopg2://beacon_ci:beacon_ci_password@127.0.0.1:5432/beacon_ci
        run: python -m pytest tests/test_queue_postgres.py -q -p no:cacheprovider
      - name: Verify Phase I load and stateless contracts
        run: python -m unittest tests.test_phase_one_load_gate -v
      - name: Verify application import
        run: python -c "import main"
      - name: Build production API image
        run: docker build --tag beacon-api:${{ github.sha }} .
      - name: Build production worker image
        run: docker build --file Dockerfile.worker --tag beacon-worker:${{ github.sha }} .
      - name: Generate API image SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: beacon-api:${{ github.sha }}
          format: cyclonedx-json
          output-file: beacon-api-sbom.cdx.json
      - name: Generate worker image SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: beacon-worker:${{ github.sha }}
          format: cyclonedx-json
          output-file: beacon-worker-sbom.cdx.json
      - name: Preserve image SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: beacon-image-sboms-${{ github.sha }}
          path: |
            beacon-api-sbom.cdx.json
            beacon-worker-sbom.cdx.json
          retention-days: 30
      - name: Scan production API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: beacon-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan production worker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: beacon-worker:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Verify production image runtime metadata
        run: |
          test "$(docker image inspect beacon-api:${{ github.sha }} --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect beacon-api:${{ github.sha }} --format '{{json .Config.Healthcheck}}')" != "null"
          test "$(docker image inspect beacon-worker:${{ github.sha }} --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect beacon-worker:${{ github.sha }} --format '{{.Config.StopSignal}}')" = "SIGTERM"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: beaconsystems.client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: beaconsystems.client/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Build production frontend
        run: npm run build
      - name: Install browser test engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser, viewport and accessibility matrix
        run: npm run test:e2e
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: beacon-browser-test-evidence-${{ github.sha }}
          path: |
            beaconsystems.client/playwright-report
            beaconsystems.client/test-results
          retention-days: 30
